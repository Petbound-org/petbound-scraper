name: data-health

# Watches the database rather than the scrape.
#
# daily-scrape runs at 08:00 UTC and normally finishes in ~15 minutes, though it
# has taken as long as 13 hours. This runs at 23:00 UTC, well after even a slow
# run, and fails if what landed does not look right. It is deliberately
# independent of daily-scrape: a scrape that never starts produces no run and
# therefore no alert, which is exactly the gap this closes.

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: MAHASVIN_SECRETS
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check database health
        run: python data_health.py
